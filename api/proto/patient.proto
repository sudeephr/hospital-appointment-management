syntax = "proto3";

package patient;

option go_package = "./api/proto";

service PatientService {
    rpc CreatePatient(CreatePatientRequest) returns (CreatePatientResponse);
    rpc GetPatients(GetPatientsRequest) returns (GetPatientsResponse);
    rpc GetPatientById(GetPatientByIdRequest) returns (GetPatientByIdResponse);
    rpc UpdatePatientById(UpdatePatientByIdRequest) returns (UpdatePatientByIdResponse);
    rpc DeletePatientById(DeletePatientByIdRequest) returns (DeletePatientByIdResponse);

}

message GetPatientsRequest {
}
message GetPatientsResponse {
    repeated Patient patients = 1;
}

message CreatePatientRequest{
    string first_name = 1;
    string last_name = 2;
    string date_of_birth = 3;
    string gender = 4;
    string phone = 5;
    string email = 6;
    string address = 7;
}
message CreatePatientResponse {
    Patient patient = 1;
}

message GetPatientByIdRequest{
    string id = 1;
}
message GetPatientByIdResponse{
   Patient patient = 1;
}

message UpdatePatientByIdRequest {
    int32 id = 1;
    string first_name = 2;
    string last_name = 3;
    string date_of_birth = 4;
    string gender = 5;
    string phone = 6;
    string email = 7;
    string address = 8;
}
message UpdatePatientByIdResponse {
    Patient patient = 1;
}

message DeletePatientByIdRequest{
    string id = 1;
}
message DeletePatientByIdResponse{
    string message = 1;
}

message Patient{
    string id = 1;
    string first_name = 2;
    string last_name = 3;
    string date_of_birth = 4;
    string gender = 5;
    string phone = 6;
    string email = 7;
    string address = 8;
    string created_at = 9;
    string updated_at = 10;
}