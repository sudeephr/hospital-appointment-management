syntax = "proto3";

package appointment;

option go_package = "./api/proto";

service AppointmentService {
    rpc CreateAppointment(CreateAppointmentRequest) returns (CreateAppointmentResponse);
    rpc GetAppointments(GetAppointmentsRequest) returns (GetAppointmentsResponse);
    rpc GetAppointmentById(GetAppointmentByIdRequest) returns (GetAppointmentByIdResponse);
    rpc UpdateAppointmentById(UpdateAppointmentByIdRequest) returns (UpdateAppointmentByIdResponse);
    rpc DeleteAppointmentById(DeleteAppointmentByIdRequest) returns (DeleteAppointmentByIdResponse);
}

message CreateAppointmentRequest {
    int32 patient_id = 1;
    int32 doctor_id = 2;
    string appointment_date = 3;
    string appointment_time = 4;
    string status = 5;
}

message CreateAppointmentResponse {
    Appointment appointment = 1;
}

message GetAppointmentsRequest {}

message GetAppointmentsResponse {
    repeated Appointment appointments = 1;
}

message GetAppointmentByIdRequest {
    string id = 1;
}

message GetAppointmentByIdResponse {
    Appointment appointment = 1;
}

message UpdateAppointmentByIdRequest {
    int32 id = 1;
    int32 patient_id = 2;
    int32 doctor_id = 3;
    string appointment_date = 4;
    string appointment_time = 5;
    string status = 6;
}

message UpdateAppointmentByIdResponse {
    Appointment appointment = 1;
}

message DeleteAppointmentByIdRequest {
    string id = 1;
}

message DeleteAppointmentByIdResponse {
    string message = 1;
}

message Appointment {
    string id = 1;
    string patient_id = 2;
    string doctor_id = 3;
    string appointment_date = 4;
    string appointment_time = 5;
    string status = 6;
}